<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Warehouse PDA Picker</title>

  <style>
    body { font-family: Arial; margin: 10px; font-size: 50px; }
    table { border-collapse: collapse; width: 100%; margin-top: 10px; }
    th { border: 1px solid #ccc; padding: 6px; text-align: center; font-size: 50px; }
    td { border: 1px solid #ccc; padding: 6px; text-align: center; font-size: 80px; }   
    input { padding: 20px; width: 500px; font-size: 50px; }
    button { padding: 20px 100px; margin-left: 40px; font-size: 50px; }
    #loading { display: none; color: green; font-weight: bold; font-size: 150px; }
  </style>
</head>

<body>

<h2>Warehouse PDA Picker</h2>

Barcode:
<input type="text" id="barcode" onkeypress="handleKey(event)">
<button onclick="searchBarcode()">Search</button>
<button onclick="submitAll()">Submit</button>

<div id="loading">Loading...</div>

<table>
  <thead>
    <tr>
      <th>Carton</th>
      <th>Qty</th>
      <th>Pick Qty</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>

const API_URL = "https://script.google.com/macros/s/AKfycbxQ_VDmvw-Va7qMvpvzlGbPaf-qnNElx8rLtq6HeWjhbOb6Yon0gfSJuxsGbCjrkdxu/exec";

function showLoading(v){
  document.getElementById("loading").style.display = v ? "block" : "none";
}

// ---------------- AUTO SEARCH ON ENTER ----------------
function handleKey(e){
  if(e.key === "Enter"){
    searchBarcode();
  }
}

// ---------------- SEARCH ----------------
async function searchBarcode(){

  const barcode = document.getElementById("barcode").value.trim();
  if(!barcode) return alert("Please Enter Barcode");

  showLoading(true);

  try {

    const res = await fetch(`${API_URL}?action=search&barcode=${barcode}`);
    const data = await res.json();

    showLoading(false);

    const tbody = document.getElementById("tbody");
    tbody.innerHTML = "";

    data.data.forEach(r => {
      const tr = document.createElement("tr");

      tr.innerHTML = `
        <td>${r.site}</td>
        <td>${r.qty}</td>
        <td>
          <input type="number" class="pick" data-id="${r.rowIndex}">
        </td>
      `;

      tbody.appendChild(tr);
    });

  } catch(err){
    showLoading(false);
    alert("Search error: " + err);
  }
}

// ---------------- SUBMIT (FIXED) ----------------
async function submitAll(){

  const inputs = document.querySelectorAll(".pick");

  let updates = [];

  inputs.forEach(i=>{
    const v = i.value;
    if(v && Number(v) > 0){
      updates.push({
        rowIndex: i.dataset.id,
        pickQty: v
      });
    }
  });

  if(updates.length === 0){
    alert("Not Enough Qty");
    return;
  }

  showLoading(true);

  try {

    // ⭐ 关键：form-urlencoded（不会 CORS preflight）
    const form = new URLSearchParams();
    form.append("action", "submitAll");
    form.append("updates", JSON.stringify(updates));

    const res = await fetch(API_URL, {
      method: "POST",
      body: form
    });

    const data = await res.json();

    showLoading(false);

    if(data.success){
      alert("Success");
      searchBarcode();
    } else {
      alert("Fail: " + data.message);
    }

  } catch(err){
    showLoading(false);
    alert("Fail: " + err);
  }
}

</script>

</body>
</html>
