<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>PDA Picker</title>

<style>

/* ===== 全局 PDA 优化 ===== */
body {
  font-family: Arial;
  margin: 0;
  padding: 10px;
  font-size: 16px;
}

/* ===== header ===== */
h2 {
  font-size: 18px;
  margin: 5px 0 10px 0;
}

/* ===== input bar ===== */
.top-bar {
  display: flex;
  gap: 5px;
  margin-bottom: 10px;
}

#barcode {
  flex: 1;
  font-size: 18px;
  padding: 10px;
}

/* buttons */
button {
  font-size: 16px;
  padding: 10px;
  min-width: 80px;
}

/* ===== table ===== */
table {
  width: 100%;
  border-collapse: collapse;
}

/* hide header (PDA cleaner) */
thead {
  display: none;
}

/* row style */
tr {
  display: grid;
  grid-template-columns: 1.2fr 0.8fr 1fr;
  gap: 5px;
  margin-bottom: 8px;
  padding: 8px;
  border: 1px solid #ddd;
  border-radius: 6px;
}

/* cells */
td {
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
}

/* Qty highlight */
td:nth-child(2) {
  font-weight: bold;
  color: #333;
}

/* input field */
input[type=number] {
  width: 100%;
  font-size: 18px;
  padding: 10px;
  text-align: center;
}

/* loading */
#loading {
  display: none;
  color: green;
  font-weight: bold;
  margin: 10px 0;
}

</style>
</head>

<body>

<h2>Warehouse PDA</h2>

<div class="top-bar">
  <input id="barcode" placeholder="Scan barcode">
  <button onclick="searchBarcode()">Search</button>
</div>

<button onclick="submitAll()">Submit</button>

<div id="loading">Loading...</div>

<table>
  <thead>
    <tr>
      <th>Site</th>
      <th>Qty</th>
      <th>Pick</th>
    </tr>
  </thead>
  <tbody id="tbody"></tbody>
</table>

<script>
const API_URL = "https://script.google.com/macros/s/AKfycbxQ_VDmvw-Va7qMvpvzlGbPaf-qnNElx8rLtq6HeWjhbOb6Yon0gfSJuxsGbCjrkdxu/exec";

function showLoading(v){
  document.getElementById("loading").style.display = v ? "block" : "none";
}

async function searchBarcode(){

  const barcode = document.getElementById("barcode").value.trim();
  if(!barcode) return alert("Scan barcode");

  showLoading(true);

  const res = await fetch(`${API_URL}?action=search&barcode=${barcode}`);
  const data = await res.json();

  showLoading(false);

  const tbody = document.getElementById("tbody");
  tbody.innerHTML = "";

  data.data.forEach(r=>{

    const tr = document.createElement("tr");

    tr.innerHTML = `
      <td>${r.site}</td>
      <td>${r.qty}</td>
      <td>
        <input type="number"
               class="pick"
               data-id="${r.rowIndex}">
      </td>
    `;

    tbody.appendChild(tr);
  });
}

async function submitAll(){

  const inputs = document.querySelectorAll(".pick");
  let updates = [];

  inputs.forEach(i=>{
    if(i.value && Number(i.value) > 0){
      updates.push({
        rowIndex: i.dataset.id,
        pickQty: i.value
      });
    }
  });

  if(updates.length === 0){
    alert("No qty");
    return;
  }

  showLoading(true);

  const form = new URLSearchParams();
  form.append("action", "submitAll");
  form.append("updates", JSON.stringify(updates));

  const res = await fetch(API_URL, {
    method: "POST",
    body: form
  });

  const data = await res.json();

  showLoading(false);

  if(data.success){
    alert("Success");
    searchBarcode();
  } else {
    alert("Fail");
  }
}

</script>

</body>
</html>
